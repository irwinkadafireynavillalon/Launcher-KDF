name: Launcher KDF CI/CD & Build Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Inject Secrets
        run: |
          API_KEY="${{ secrets.GEMINI_API_KEY }}"
          if [ -z "$API_KEY" ]; then
            API_KEY="AI_STUDIO_KEY_PLACEHOLDER"
          fi
          echo "GEMINI_API_KEY=$API_KEY" > .env
          echo "GEMINI_API_KEY=$API_KEY" > app/.env
          echo "GEMINI_API_KEY=$API_KEY" > .env.example
          echo "GEMINI_API_KEY=$API_KEY" > app/.env.example

      - name: Build Android APK (Debug)
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Package & Prepare APK
        run: |
          mkdir -p dist_apk
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} dist_apk/12_Launcher_KDF.apk \;
          cp dist_apk/12_Launcher_KDF.apk dist_apk/Launcher-KDF.apk
          ls -la dist_apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Launcher-KDF-APK
          path: dist_apk/*.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-Launcher
          name: "⚡ Launcher KDF v1.0.0 · Orquestador Híbrido Hyper Lux (Android APK)"
          draft: false
          prerelease: false
          body: |
            ### ⚡ Launcher KDF · Orquestador Híbrido Hyper Lux (Android APK)
            Compilado automáticamente desde el proyecto oficial de Google AI Studio.
            
            #### 🌟 Características integradas:
            - Launcher de inicio del sistema Android con 10 temas vibrantes personalizables
            - Orquestador dual de Inteligencia Artificial (Gemini Nube + Termux Localhost / Llama / Gemma)
            - Centro de control de hardware, bio-telemetría y aceleración computacional
            - Conexión autónoma con la suite privada KDF-Studio en Termux
            
            #### 📥 Instalación:
            1. Descarga el archivo adjunto `12_Launcher_KDF.apk` a tu teléfono Android.
            2. Abre el archivo descargado para instalarlo.
            3. Si el sistema lo solicita, autoriza "Instalar aplicaciones de fuentes desconocidas".
          files: |
            dist_apk/12_Launcher_KDF.apk
            dist_apk/Launcher-KDF.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
